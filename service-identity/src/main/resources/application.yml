spring:
  application:
    name: ${IDENTITY_APP_NAME:taskapi-identity}
  datasource:
    url: jdbc:sqlserver://localhost:${MSSQL_PORT};databaseName=${DB_NAME};encrypt=false
    username: ${APP_USER}
    password: ${APP_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: ${IDENTITY_JPA_DDL_AUTO}

springdoc:
  api-docs:
    path: /api-docs

server:
  port: ${IDENTITY_APP_PORT}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

logging:
  level:
    root: INFO
    com.example.TaskAPI: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] [%X{requestId:-}] %-40.40logger{39} : %msg %kvp%n"
  structured:
    ecs:
      service:
        environment: ${APP_ENV:local}
    json:
      stacktrace:
        root: first
        max-length: 4096
        include-common-frames: false
        include-hashes: true
      customizer: com.example.TaskAPI.core.observability.PiiMaskingCustomizer
      exclude: message

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${IDENTITY_APP_NAME}