spring:
  application:
    name: ${IDENTITY_APP_NAME}
  datasource:
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME};encrypt=${DB_ENCRYPT};trustServerCertificate=${DB_TRUST_CERT}
    username: ${APP_USER}
    password: ${APP_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 600000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: ${IDENTITY_JPA_DDL_AUTO}
  liquibase:
    enabled: true
    change-log: classpath:database/changelog/identity/db.changelog-master.yaml
    database-change-log-table: DATABASECHANGELOG_IDENTITY
    database-change-log-lock-table: DATABASECHANGELOGLOCK_IDENTITY
  lifecycle:
    timeout-per-shutdown-phase: 30s

springdoc:
  api-docs:
    path: /api-docs

server:
  port: ${IDENTITY_APP_PORT}
  shutdown: graceful

jwt:
  public-key: ${JWT_PUBLIC_KEY}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  signing:
    private-key: ${JWT_PRIVATE_KEY}
    expiration: ${JWT_EXPIRATION:3600000}

logging:
  level:
    root: INFO
    com.example.TaskAPI: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [${spring.application.name}] [%X{traceId:-no-trace}] [%X{requestId:-}] %-40.40logger{39} : %msg %kvp%n"
  structured:
    ecs:
      service:
        environment: ${APP_ENV:local}
    json:
      stacktrace:
        root: first
        max-length: 4096
        include-common-frames: false
        include-hashes: true
      customizer: com.example.TaskAPI.core.observability.PiiMaskingCustomizer
      exclude: message

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${IDENTITY_APP_NAME}