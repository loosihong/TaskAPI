spring:
  main:
    banner-mode: off

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.example.TaskAPI: INFO
    org.hibernate.SQL: WARN

jobrunr:
  dashboard:
    enabled: false
  database:
    skip-create: true

management:
  tracing:
    sampling:
      probability: 0.1