spring:
  application:
    name: ${TASK_APP_NAME}
  datasource:
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=${DB_ENCRYPT};trustServerCertificate=${DB_TRUST_CERT}
    username: ${APP_USER}
    password: ${APP_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 600000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: ${TASK_JPA_DDL_AUTO}
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:database/changelog/task/db.changelog-master.yaml
    database-change-log-table: DATABASECHANGELOG_TASK
    database-change-log-lock-table: DATABASECHANGELOGLOCK_TASK
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
      table-prefix: BATCH_
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 20s
    serviceclient:
      hackerrank:
        base-url: ${HACKERRANK_BASE_URL}
        read-timeout: 5s
  cache:
    cache-names: hackerrank-articles
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    async:
      request-timeout: -1

springdoc:
  api-docs:
    path: /api-docs

server:
  port: ${TASK_APP_PORT}
  shutdown: graceful

jwt:
  public-key: ${JWT_PUBLIC_KEY}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}

jobrunr:
  job-scheduler:
    enabled: true
  background-job-server:
    enabled: true
  dashboard:
    enabled: true
    port: ${JOBRUNR_PORT:8000}
  database:
    skip-create: true
    table-prefix: "jobrunr_task."
  jobs:
    default-number-of-retries: 5
  miscellaneous:
    allow-anonymous-data-usage: false

logging:
  level:
    root: INFO
    com.example.TaskAPI: INFO
    com.zaxxer.hikari.HikariConfig: ERROR
    org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration: ERROR
    io.micrometer.core.instrument.binder.cache.CaffeineCacheMetrics: ERROR
    org.springdoc.core.events.SpringDocAppInitializer: ERROR
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [${spring.application.name}] [%X{traceId:-no-trace}] [%X{requestId:-}] %-40.40logger{39} : %msg %kvp%n%wEx"
  structured:
    ecs:
      service:
        environment: ${APP_ENV:local}
    json:
      stacktrace:
        root: first
        max-length: 4096
        include-common-frames: false
        include-hashes: true
      customizer: com.example.TaskAPI.core.observability.PiiMaskingCustomizer
      exclude: message

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${TASK_APP_NAME}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,300ms,500ms,1s,2s