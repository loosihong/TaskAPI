spring:
  application:
    name: ${TASK_APP_NAME}
  datasource:
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=${DB_ENCRYPT};trustServerCertificate=${DB_TRUST_CERT}
    username: ${APP_USER}
    password: ${APP_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: ${TASK_JPA_DDL_AUTO}
    properties:
      hibernate:
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 100
  flyway:
    enabled: true
    table: flyway_schema_history_identity
    locations: classpath:db/migration/identity
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
      table-prefix: BATCH_
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 20s
    serviceclient:
      hackerrank:
        base-url: ${HACKERRANK_BASE_URL}
        read-timeout: 5s
  cache:
    cache-names: hackerrank-articles
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m

springdoc:
  api-docs:
    path: /api-docs

server:
  port: ${TASK_APP_PORT}

jwt:
  secret: ${JWT_SECRET}

jobrunr:
  job-scheduler:
    enabled: true
  background-job-server:
    enabled: true
  dashboard:
    enabled: true
    port: ${JOBRUNR_PORT:8000}
  database:
    skip-create: false
    table-prefix: "jobrunr_task."
  jobs:
    default-number-of-retries: 5
  miscellaneous:
    allow-anonymous-data-usage: false

logging:
  level:
    root: INFO
    com.example.TaskAPI: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [${spring.application.name}] [%X{traceId:-no-trace}] [%X{requestId:-}] %-40.40logger{39} : %msg %kvp%n"
  structured:
    ecs:
      service:
        environment: ${APP_ENV:local}
    json:
      stacktrace:
        root: first
        max-length: 4096
        include-common-frames: false
        include-hashes: true
      customizer: com.example.TaskAPI.core.observability.PiiMaskingCustomizer
      exclude: message

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${TASK_APP_NAME}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,300ms,500ms,1s,2s