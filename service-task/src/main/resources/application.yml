spring:
  application:
    name: ${SPRING_APP_NAME}
  datasource:
    url: jdbc:sqlserver://localhost:${MSSQL_PORT};databaseName=${DB_NAME};encrypt=false
    username: ${APP_USER}
    password: ${APP_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
      table-prefix: BATCH_
  http:
    clients:
      service:
        connect-timeout: 5s
        read-timeout: 20s
    serviceclient:
      hackerrank:
        base-url: ${HACKERRANK_BASE_URL}
        read-timeout: 5s
  cache:
    cache-names: hackerrank-articles
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m

springdoc:
  api-docs:
    path: /api-docs

server:
  port: ${APP_PORT}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

jobrunr:
  job-scheduler:
    enabled: true
  background-job-server:
    enabled: true
  dashboard:
    enabled: true
    port: 8000
  database:
    skip-create: false
    table-prefix: "jobrunr_task."
  jobs:
    default-number-of-retries: 5
  miscellaneous:
    allow-anonymous-data-usage: false

logging:
  level:
    root: INFO
    com.example.TaskAPI: INFO