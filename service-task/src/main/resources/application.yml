spring:
  application:
    name: $(SPRING_APP_NAME)

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:sqlserver://localhost:${MSSQL_PORT:1433};databaseName=${DB_NAME};encrypt=false
    username: ${APP_USER}
    password: ${APP_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_SHOW_SQL:update}

springdoc:
  api-docs:
    path: /api-docs

server:
  port: ${APP_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

