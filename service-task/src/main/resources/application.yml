spring:
  application:
    name: ${SPRING_APP_NAME}
  datasource:
    url: jdbc:sqlserver://localhost:${MSSQL_PORT};databaseName=${DB_NAME};encrypt=false
    username: ${APP_USER}
    password: ${APP_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    properties:
      hibernate:
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 100
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
      table-prefix: BATCH_
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 20s
    serviceclient:
      hackerrank:
        base-url: ${HACKERRANK_BASE_URL}
        read-timeout: 5s
  cache:
    cache-names: hackerrank-articles
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m

springdoc:
  api-docs:
    path: /api-docs

server:
  port: ${APP_PORT}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

jobrunr:
  job-scheduler:
    enabled: true
  background-job-server:
    enabled: true
  dashboard:
    enabled: true
    port: ${JOBRUNR_PORT:8000}
  database:
    skip-create: false
    table-prefix: "jobrunr_task."
  jobs:
    default-number-of-retries: 5
  miscellaneous:
    allow-anonymous-data-usage: false

logging:
  level:
    root: INFO
    com.example.TaskAPI: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] [%X{requestId:-}] %-40.40logger{39} : %msg %kvp%n"
  structured:
    ecs:
      service:
        environment: ${APP_ENV:local}
    json:
      stacktrace:
        root: first
        max-length: 4096
        include-common-frames: false
        include-hashes: true