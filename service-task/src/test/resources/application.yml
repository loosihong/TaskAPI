spring:
  test:
    database:
      replace: NONE
  datasource:
    hikari:
      connection-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
      table-prefix: BATCH_
    custom:
      default-batch-size: 5
  main:
    allow-bean-definition-overriding: true
  http:
    serviceclient:
      hackerrank:
        base-url: http://localhost:10000
  liquibase:
    enabled: false

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 3600000

jobrunr:
  database:
    table-prefix: ""
  background-job-server:
    enabled: false
  dashboard:
    enabled: false

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces