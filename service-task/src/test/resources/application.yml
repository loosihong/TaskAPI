spring:
  test:
    database:
      replace: NONE
  datasource:
    hikari:
      connection-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
      table-prefix: BATCH_
    custom:
      default-batch-size: 5
  main:
    allow-bean-definition-overriding: true
  http:
    client:
      service:
        group:
          hacker-rank:
            base-url: http://localhst:10000

